name: Extract iStoreOS RootFS

on:
  workflow_dispatch:          # 支持手动点击运行
  #schedule:
    #- cron: '0 0 * * *'        # 每天 UTC 0:00 (北京时间 08:00) 自动检查并更新

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write         # 必须具备 Release 写入权限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl p7zip-full squashfs-tools

      - name: Fetch Latest Firmware and Extract RootFS
        id: extract
        run: |
          BASE_URL="https://fw.koolcenter.com/iStoreOS/armsr/"
          
          echo "==> 获取最新固件文件名..."
          LATEST_FILE=$(curl -s "$BASE_URL" | grep -oE 'istoreos-[0-9a-zA-Z\.\-]+armsr-squashfs-combined-efi\.img\.gz' | head -n 1)
          
          if [ -z "$LATEST_FILE" ]; then
            echo "错误：未能获取到最新的固件文件名！"
            exit 1
          fi

          FILE_URL="${BASE_URL}${LATEST_FILE}"
          RAW_NAME="${LATEST_FILE%.img.gz}"
          IMG_FILE="${LATEST_FILE%.gz}"
          TAR_FILE="${RAW_NAME}-rootfs.tar.gz"

          echo "最新文件名: $LATEST_FILE"
          echo "RootFS打包文件名: $TAR_FILE"

          echo "==> 开始下载固件..."
          curl -C - -O "$FILE_URL"

          echo "==> 解压 .gz (通过管道解压避免 trailing garbage 报错退出)..."
          gzip -dc "$LATEST_FILE" > "$IMG_FILE" || true
          if [ ! -s "$IMG_FILE" ]; then
            echo "错误：镜像解压失败，文件为空！"
            exit 1
          fi
          echo "==> 使用 7z 解析磁盘镜像分区..."
          mkdir -p extracted_img
          7z x -y "$IMG_FILE" -o"extracted_img"
          echo "==> 自动检测 RootFS 分区文件与文件系统类型..."
          TARGET_PART=""
          FS_TYPE=""

          for f in extracted_img/*; do
            TYPE_INFO=$(file "$f")
            echo "检查分区文件: $f -> $TYPE_INFO"
            if echo "$TYPE_INFO" | grep -qi "Squashfs"; then
              TARGET_PART="$f"
              FS_TYPE="squashfs"
              break
            elif echo "$TYPE_INFO" | grep -qi "ext[2-4]"; then
              TARGET_PART="$f"
              FS_TYPE="ext4"
              break
            fi
          done
          # 如果 file 未能识别明确格式，默认获取大于 10MB 的主要分区文件
          if [ -z "$TARGET_PART" ]; then
            TARGET_PART=$(find extracted_img -type f -size +10M | head -n 1)
          fi

          if [ -z "$TARGET_PART" ]; then
            echo "错误：未找到有效的主分区文件！"
            exit 1
          fi

          echo "==> 目标分区文件: $TARGET_PART (检测类型: ${FS_TYPE:-未知})"

          rm -rf rootfs
          mkdir -p rootfs

          # 根据检测结果采用不同的提取策略
          if [ "$FS_TYPE" = "squashfs" ]; then
            echo "==> 使用 unsquashfs 提取 SquashFS 文件系统..."
            sudo unsquashfs -f -d rootfs "$TARGET_PART"
          elif [ "$FS_TYPE" = "ext4" ]; then
            echo "==> 使用 Loop 挂载提取 Ext4 文件系统..."
            mkdir -p mnt_tmp
            sudo mount -o loop "$TARGET_PART" mnt_tmp
            sudo cp -a mnt_tmp/. rootfs/
            sudo umount mnt_tmp
            rm -rf mnt_tmp
          else
            echo "==> 未知类型，尝试通用兼容提取..."
            if sudo unsquashfs -f -d rootfs "$TARGET_PART" 2>/dev/null; then
              echo "SquashFS 提取成功！"
            else
              echo "SquashFS 识别失败，尝试 Loop 挂载..."
              mkdir -p mnt_tmp
              sudo mount -o loop "$TARGET_PART" mnt_tmp
              sudo cp -a mnt_tmp/. rootfs/
              sudo umount mnt_tmp
              rm -rf mnt_tmp
            fi
          fi

          echo "==> 打包 RootFS 为 $TAR_FILE..."
          cd rootfs
          sudo tar -czf "../$TAR_FILE" .
          cd ..

          # 将变量导出供后续步骤使用
          echo "TAR_FILE=$TAR_FILE" >> $GITHUB_ENV
          echo "RAW_NAME=$RAW_NAME" >> $GITHUB_ENV
          echo "LATEST_FILE=$LATEST_FILE" >> $GITHUB_ENV

      - name: Delete Old Release and Tag
        run: |
          echo "==> 删除旧的 Release 和 Tag 以重置时间戳与附件列表..."
          gh release delete OpenWrt_istoreos_rootfs --cleanup-tag -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OpenWrt_istoreos_rootfs
          name: "iStoreOS ARMSR RootFS"
          body: |
            ## iStoreOS RootFS 最新提取
            - **文件名称**: `${{ env.TAR_FILE }}`
            - **源固件包**: `${{ env.LATEST_FILE }}`
            - **更新时间**: `${{ env.RAW_NAME }}`
          files: ${{ env.TAR_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
